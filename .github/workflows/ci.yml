name: CI

on:
  push:
    branches: [ master, dev2026 ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3feca5c6 # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests (Offline Mock Mode)
        run: npm test
        env:
          QRL_TEST_OFFLINE: 'true'

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3feca5c6 # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Binaries
        run: npm run make-binaries

      - name: Package Binaries
        run: |
          (cd dist && find . -type f -print0 | xargs -0 shasum -a 256 > ../shasum.256.asc)
          cp shasum.256.asc dist/
          zip -r qrl-cli-macos-x64.zip dist/macos-x64
          zip -r qrl-cli-macos-arm64.zip dist/macos-arm64
          zip -r qrl-cli-linux-x64.zip dist/linux-x64
          zip -r qrl-cli-linux-arm64.zip dist/linux-arm64
          zip -r qrl-cli-win-x64.zip dist/win-x64

      - name: Publish Release on GitHub
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
